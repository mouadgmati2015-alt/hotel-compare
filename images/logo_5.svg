<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 0 630 640" width="630" height="640" role="img" aria-label="MyHotelCompare" xmlns:c2pa="http://c2pa.org/manifest">
  <title>MyHotelCompare</title>
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f80c0"/>
      <stop offset="1" stop-color="#1a4780"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7ab8"/>
      <stop offset="1" stop-color="#1a4a80"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7f2a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1b3f73" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g transform="translate(-833 -288)">
    <!-- Fond de l'icône -->
    <rect x="993" y="308" width="589" height="573" rx="105" fill="#ffffff" filter="url(#shadow)"/>

    <!-- Cheminée -->
    <rect x="1377" y="432" width="59" height="90" fill="url(#wall)"/>
    <rect x="1377" y="412" width="69" height="22" fill="#38b6e8"/>

    <!-- Murs -->
    <rect x="1141" y="556" width="59" height="247" fill="url(#wall)"/>
    <rect x="1377" y="640" width="59" height="163" fill="url(#wall)"/>

    <!-- Toit -->
    <polygon points="1040,596 1288,384 1536,596 1470,596 1288,440 1106,596" fill="url(#roof)"/>

    <!-- Étoile -->
    <polygon fill="#ff8a2a" points="1281,504 1290.4,528.1 1316.2,529.6 1296.2,545.9 1302.8,570.9 1281,557 1259.2,570.9 1265.8,545.9 1245.8,529.6 1271.6,528.1"/>

    <!-- Flèche (contour blanc pour détacher des murs) -->
    <path d="M1138,795 C1150,700 1250,648 1347,638 L1342,575 L1432,620 L1357,700 L1356,692 C1260,700 1170,730 1138,795 Z"
          fill="url(#arrow)" stroke="#ffffff" stroke-width="9" stroke-linejoin="round" paint-order="stroke"/>
  </g>


<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
