<svg viewBox="0 0 600 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .word { font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Icon: two overlapping cards (comparison) with a check where they agree on the winner -->
  <g>
    <rect x="140" y="70" width="220" height="220" rx="44" fill="#FF6F59"/>
    <rect x="240" y="70" width="220" height="220" rx="44" fill="#17A398" fill-opacity="0.82"/>
    <path d="M 282 181 L 295 195 L 321 161" fill="none" stroke="#FFFFFF" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="300" y="410" text-anchor="middle" class="word"
        font-size="66" font-weight="700" letter-spacing="-1.5" fill="#12213C">hotelcompare</text>

  <!-- Tagline -->
  <text x="300" y="448" text-anchor="middle" class="word"
        font-size="22" font-weight="500" fill="#4A5B7A">le comparateur intelligent</text>
</svg>
